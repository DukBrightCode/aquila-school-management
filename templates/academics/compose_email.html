{% extends 'base.html' %}

{% block title %}Compose Email - {{ student.user.get_full_name }}{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto py-8">
    <div class="bg-white rounded-lg shadow-md border border-gray-200 overflow-hidden">
        
        <!-- Header -->
        <div class="bg-gray-800 px-6 py-4 flex items-center justify-between">
            <h2 class="text-lg font-medium text-white flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </svg>
                Compose Email
            </h2>
            <a href="{% url 'academics:report_card' student.id term.id %}" class="text-gray-300 hover:text-white text-sm">
                Cancel
            </a>
        </div>

        <!-- Form -->
        <form method="POST" enctype="multipart/form-data" class="p-6 space-y-5">
            {% csrf_token %}

            <!-- To Email -->
            <div>
                <label for="recipient_email" class="block text-sm font-medium text-gray-700 mb-1">To:</label>
                <input type="email" id="recipient_email" name="recipient_email" value="{{ recipient_email }}" required
                    class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm px-3 py-2 border">
            </div>

            <!-- Subject -->
            <div>
                <label for="subject" class="block text-sm font-medium text-gray-700 mb-1">Subject:</label>
                <input type="text" id="subject" name="subject" value="{{ default_subject }}" required
                    class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm px-3 py-2 border">
            </div>

            <!-- Message Body -->
            <div>
                <label for="message" class="block text-sm font-medium text-gray-700 mb-1">Message:</label>
                <textarea id="message" name="message" rows="8" required
                    class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm px-3 py-2 border">{{ default_body }}</textarea>
            </div>

            <!-- Attachment Selection Area -->
            <div class="border-t border-gray-200 pt-4">
                <div class="flex items-center gap-3">
                    <label for="attachments" class="cursor-pointer inline-flex items-center gap-2 px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none">
                        <!-- Paperclip Icon -->
                        <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/>
                        </svg>
                        <span>Attach File / Upload Result</span>
                    </label>
                    <input type="file" id="attachments" name="attachments" multiple class="hidden" onchange="displaySelectedFiles(this)">
                    <span id="file_list" class="text-sm text-gray-500 italic">No file attached</span>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex justify-end gap-3 pt-4 border-t border-gray-200">
                <a href="{% url 'academics:report_card' student.id term.id %}" 
                   class="px-4 py-2 bg-gray-100 text-gray-700 hover:bg-gray-200 rounded-md text-sm font-medium">
                    Cancel
                </a>
                <button type="submit" 
                        class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md text-sm font-medium shadow-sm inline-flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                    </svg>
                    Send Email
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    function displaySelectedFiles(input) {
        const fileListDisplay = document.getElementById('file_list');
        if (input.files && input.files.length > 0) {
            const fileNames = Array.from(input.files).map(f => f.name).join(', ');
            fileListDisplay.textContent = `Attached: ${fileNames}`;
            fileListDisplay.classList.remove('text-gray-500', 'italic');
            fileListDisplay.classList.add('text-blue-600', 'font-medium');
        } else {
            fileListDisplay.textContent = 'No file attached';
            fileListDisplay.classList.add('text-gray-500', 'italic');
        }
    }
</script>
{% endblock %}
