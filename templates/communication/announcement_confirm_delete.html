{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto py-12 px-4">
    <div class="bg-white p-8 rounded-lg shadow-md border border-gray-200 text-center">
        <h1 class="text-2xl font-bold text-gray-800 mb-4">Delete Announcement</h1>
        <p class="text-gray-600 mb-6">Are you sure you want to delete "<strong>{{ announcement.title }}</strong>"? This action cannot be undone.</p>
        <form method="post" class="flex justify-center space-x-4">
            {% csrf_token %}
            <a href="{% url 'communication:list' %}" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300 transition">Cancel</a>
            <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition">Confirm Delete</button>
        </form>
    </div>
</div>
{% endblock %}
