{% extends "base.html" %}
{% block content %}
<div class="container mx-auto max-w-md p-6">
    <div class="bg-white p-6 rounded shadow text-center">
        <h1 class="text-xl font-bold mb-4 text-gray-800">Confirm Deletion</h1>
        <p class="text-gray-600 mb-6">Are you sure you want to delete the grading scale for <strong>{{ grading_scale.grade_letter }}</strong>?</p>
        
        <form method="post" class="flex justify-center space-x-4">
            {% csrf_token %}
            <a href="{% url 'dashboard:grading_scale_list' %}" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded">
                Cancel
            </a>
            <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded shadow">
                Yes, Delete
            </button>
        </form>
    </div>
</div>
{% endblock %}
