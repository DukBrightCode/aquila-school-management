{% extends "base.html" %}
{% block content %}
<div class="container mx-auto max-w-lg p-6">
    <div class="bg-white p-6 rounded shadow">
        <h1 class="text-2xl font-bold mb-6 text-gray-800">{{ title }}</h1>
        
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {{ form.non_field_errors }}
            
            {% for field in form %}
            <div>
                <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <p class="text-red-600 text-xs mt-1">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
            {% endfor %}

            <div class="flex justify-end space-x-3 pt-4">
                <a href="{% url 'dashboard:grading_scale_list' %}" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded">
                    Cancel
                </a>
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded shadow">
                    Save
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
